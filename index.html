<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Қазақстанның ғарышты игерудегі жетістіктері</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap">
<style>
:root{--bg:#030a1f;--tx:#f2f6ff;--mu:#9fb2d6;--a:#00afca;--g:#fec50c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:radial-gradient(ellipse at 70% 0,#0b2150,var(--bg) 70%);color:var(--tx);font-family:Inter,system-ui,sans-serif;overflow:hidden}
#bg{position:fixed;inset:0;z-index:0}
#app{position:relative;height:100%;z-index:1}
.s{position:absolute;inset:0;padding:28px 6vw 76px;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:scale(1.25);filter:blur(10px);transition:opacity .55s,transform .55s,filter .55s;pointer-events:none;overflow-y:auto;overflow-x:hidden}

h1{font-size:clamp(30px,6vw,60px);line-height:1.12;margin:.2em 0;font-weight:800}

.card{padding:18px 20px;border-radius:16px;background:#0a1c4acc;border:1px solid #ffffff22;border-top:3px solid var(--a);opacity:0}

.s.on .card{animation:pop .55s backwards calc(.25s + var(--i)*.12s);opacity:1}
.map{grid-column:span 2;display:flex;align-items:center;justify-content:center;border-top-color:var(--g)}
.map svg{width:100%;max-height:230px}

.s.on .map path{animation:draw 2.4s forwards .4s}

.tag{letter-spacing:.3em;color:var(--g);font-size:13px;font-weight:600;margin:0}
.who{color:var(--mu);font-size:15px;margin-top:20px}

#pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--g));transition:width .6s}
#ct{color:var(--mu);font-size:13px;min-width:44px;text-align:center}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes right{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

@keyframes ping{50%{opacity:.3}}

.rk{position:absolute;left:-130px;width:90px;filter:drop-shadow(0 0 8px #00afca)}
.rk svg{display:block;width:100%}

.rk.b{top:64%;width:60px;opacity:.7;animation:fly 6s linear infinite 4s}

.p1{right:6%;top:10%;width:90px;height:90px;background:radial-gradient(circle at 30% 30%,#5ad0e6,#0b3a7a 60%,#030a1f);box-shadow:0 0 30px #00afca66}

.card{position:relative;overflow:hidden;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px) scale(1.03);box-shadow:0 0 28px #00afca88}
.card::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffff22,transparent);transform:skewX(-20deg)}
.s.on .card::after{animation:sh 4s infinite calc(1s + var(--i)*.4s)}
.s.on h1{background:linear-gradient(90deg,#fff 30%,#fec50c 50%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleIn .7s both .1s,shim 4s linear infinite 1s}
em{animation:glow 2s ease-in-out infinite alternate}
.ev::before{content:"";position:absolute;top:-21px;left:0;width:12px;height:12px;border-radius:50%;background:var(--g);box-shadow:0 0 12px var(--g)}
.ev{position:relative}
.tl::after{content:"";position:absolute;top:-4px;left:0;width:11px;height:11px;border-radius:50%;background:#fff;box-shadow:0 0 14px 4px var(--g);opacity:0}
.s.on .tl::after{animation:run 1.8s ease-out forwards .3s}
.vis{animation:bob 5s ease-in-out infinite alternate}
.fxw{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.nova,.trail,.rk2,.beam,.ering{position:absolute;pointer-events:none;opacity:0}

.s.on[data-fx="scan"] .card{animation:none;opacity:1}
@keyframes wipev{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0)}}
.ering{left:50%;top:50%;width:40px;height:40px;margin:-20px;border:2px solid #fec50c;border-radius:50%}

@keyframes ering{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(16)}}
.s.on[data-fx="orbit"] .card{animation:orb 1.2s cubic-bezier(.2,.8,.2,1) backwards calc(.2s + var(--i)*.15s)}
@keyframes orb{from{opacity:0;transform:rotate(calc(540deg + var(--i)*60deg)) translateX(420px) rotate(calc(-540deg - var(--i)*60deg)) scale(.2)}}
@keyframes titleIn{from{opacity:0;letter-spacing:.25em;filter:blur(12px)}to{opacity:1;letter-spacing:0;filter:none}}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.8) rotate(-3deg)}}
@keyframes fly{from{transform:translateX(0)}50%{transform:translate(55vw,-30px)}to{transform:translateX(calc(100vw + 260px))}}
@keyframes flyr{from{transform:scaleX(-1)}to{transform:translateX(calc(-100vw - 260px)) scaleX(-1)}}
@keyframes launch{to{transform:rotate(-90deg) translateX(calc(100vh + 200px))}}
@keyframes fk{to{transform:scaleX(1.7)}}
@keyframes ssh{0%{opacity:0;transform:translate(0,0) rotate(-30deg)}5%{opacity:1}20%{opacity:0;transform:translate(-500px,290px) rotate(-30deg)}100%{opacity:0}}
@keyframes wp{0%{opacity:0;transform:scale(.4)}30%{opacity:.8}100%{opacity:0;transform:scale(2.4)}}
@keyframes sh{0%{left:-60%}30%,100%{left:130%}}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
@keyframes glow{from{text-shadow:0 0 0 #fec50c00}to{text-shadow:0 0 12px #fec50c}}
@keyframes run{0%{opacity:1;left:0}100%{opacity:0;left:100%}}
@keyframes bob{to{transform:translateY(-14px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important}#fx,#warp{display:none}}
</style></head><body>
<canvas id="bg"></canvas><div id="app"></div>
<div id="nav"><button id="pv" aria-label="Алдыңғы">‹</button><div id="pb"><i></i></div><span id="ct"></span><button id="nx" aria-label="Келесі">›</button></div>
<script>

const S=[
{k:'hero',tag:'ҚАЗАҚСТАН · ҒАРЫШ',t:'Қазақстанның ғарышты игерудегі жетістіктері',sub:'Байқоңырдан болашаққа',who:'Орындаған: [Студенттің аты-жөні] · [Топ]'},

{t:'Қазақстанның ғарыштық технологиялары',c:[['Қашықтан зондтау','<em>KazEOSat-1</em> (2014): Жерді жоғары дәлдікпен түсіру'],['Спутниктер','<em>KazSat-1, 2, 3</em> байланыс спутниктері'],['Байланыс жүйелері','Теледидар, <em>интернет</em> және деректер беру'],['Ғарыштық деректер','Жерді <em>мониторингілеу</em> және картографиялау']]},
{t:'Ғарыш саласының маңызы',c:[['Ғылым','Жаңа <em>зерттеулер</em> мен тәжірибелер'],['Білім','Инженерлер мен ғалымдар <em>даярлау</em>'],['Байланыс','Ел бойынша <em>сенімді байланыс</em>'],['Экология','Табиғат жағдайын <em>бақылау</em>'],['Ауыл шаруашылығы','Егін алқаптарын <em>спутниктен</em> бақылау'],['Технологиялық даму','Ұлттық <em>инновациялар</em> дамуы']]},
{t:'Болашақ',c:[['Жаңа спутниктер','Жетілдірілген <em>спутниктік технологиялар</em>'],['Ғарыштық зерттеулер','Ғылыми бағдарламаларды <em>кеңейту</em>'],['STEM және жастар','Жастардың <em>ғылым мен инженерияға</em> қызығушылығы'],['Ынтымақтастық','<em>Халықаралық</em> серіктестік']]},
{k:'hero',tag:'ТАРИХТАН БОЛАШАҚҚА',t:'Қазақстан және ғарыш: тарихтан болашаққа',sub:'Назарларыңызға рақмет!',who:''}
];

const fx=document.createElement('div');fx.id='fx';
fx.innerHTML=['a','b','c'].map(k=>`<div class="rk ${k}">${RK}</div>`).join('')+[[8,70,3],[25,40,7],[5,90,1],[40,60,5]].map(a=>`<div class="ss" style="top:${a[0]}%;left:${a[1]}%;animation-delay:${a[2]}s"></div>`).join('')+'<div class="pl p1"></div><div class="pl p2"></div>';

const wpl=document.createElement('div');wpl.id='warp';document.body.append(wpl);
function boom(){wp=1;wpl.classList.remove('go');void wpl.offsetWidth;wpl.classList.add('go');const r=document.createElement('div');r.className='rk l';r.style.setProperty('--x',(10+Math.random()*75)+'vw');r.innerHTML=RK;fx.appendChild(r);setTimeout(()=>r.remove(),1000)}
const app=document.getElementById('app');
S.forEach(d=>{const e=document.createElement('section');e.className='s';let h='';
